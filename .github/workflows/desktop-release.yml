name: Desktop Installers

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional GitHub Release tag to upload installers to"
        required: false
        type: string
      upload_to_release:
        description: "Upload installers to the GitHub Release named by release_tag"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  NODE_VERSION: 22
  PNPM_VERSION: 10.13.1
  RUST_TOOLCHAIN: nightly-2025-12-04
  SQLX_OFFLINE: "true"
  SQLX_OFFLINE_DIR: ${{ github.workspace }}/crates/db/.sqlx

jobs:
  prepare-release:
    name: Prepare GitHub Release
    if: ${{ inputs.upload_to_release && inputs.release_tag != '' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
          else
            gh release create "$RELEASE_TAG" \
              --repo "$RELEASE_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --notes "Desktop installers for $RELEASE_TAG."
          fi

  build:
    name: Build ${{ matrix.artifact_name }}
    needs: prepare-release
    if: ${{ always() && !failure() && !cancelled() }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact_name: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
          - artifact_name: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - artifact_name: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - artifact_name: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xauth \
            xvfb

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          cache-provider: github
          cache-on-failure: true
          shared-key: desktop-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}
          cache-all-crates: true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/run-tauri-build.js --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Smoke-test Linux desktop startup through XWayland
        if: runner.os == 'Linux'
        env:
          GDK_BACKEND: wayland
        run: |
          executable="target/${{ matrix.target }}/release/vibex"
          set +e
          timeout --signal=TERM 10s xvfb-run -a "$executable" >vibex-startup.log 2>&1
          exit_code=$?
          set -e
          if [ "$exit_code" -ne 124 ] && [ "$exit_code" -ne 143 ]; then
            cat vibex-startup.log
            echo "VibeX exited during the Linux startup smoke test (code $exit_code)."
            exit 1
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibeX-${{ matrix.artifact_name }}
          if-no-files-found: error
          path: |
            target/${{ matrix.target }}/release/bundle/**/*
            target/release/bundle/**/*

      - name: Upload installers to GitHub Release
        if: ${{ inputs.upload_to_release && inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: |
            target/${{ matrix.target }}/release/bundle/**/*.msi
            target/${{ matrix.target }}/release/bundle/**/*.exe
            target/${{ matrix.target }}/release/bundle/**/*.AppImage
            target/${{ matrix.target }}/release/bundle/**/*.deb
            target/${{ matrix.target }}/release/bundle/**/*.dmg
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.dmg

  publish-updater:
    name: Publish updater manifest
    needs: build
    if: ${{ inputs.upload_to_release && inputs.release_tag != '' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download desktop build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: VibeX-*
          path: updater-artifacts

      - name: Generate updater manifest
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          node scripts/generate-updater-manifest.js \
            --artifacts-dir updater-artifacts \
            --output-dir updater-release \
            --repository "$RELEASE_REPOSITORY" \
            --release-tag "$RELEASE_TAG" \
            --version "$VERSION"

      - name: Upload updater manifest and signed bundles
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          fail_on_unmatched_files: true
          files: updater-release/*

      - name: Mark desktop release as latest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release edit "$RELEASE_TAG" --latest

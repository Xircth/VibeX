name: Server Release

# Builds the unsigned Server directory (vibex-server + web + bundled plugins).
# Apple Developer ID and Windows Authenticode are intentionally not required.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: 22
  PNPM_VERSION: 10.13.1
  RUST_TOOLCHAIN: nightly-2025-12-04
  SQLX_OFFLINE: "true"

jobs:
  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            release_name: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: linux-arm64
            release_name: linux-aarch64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macos-arm64
            release_name: darwin-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
          - name: macos-x64
            release_name: darwin-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - name: windows-x64
            release_name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - name: windows-arm64
            release_name: windows-aarch64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm run frontend:build

      - name: Build Host binaries
        run: cargo build --release --target ${{ matrix.target }} -p server -p vibex-mcp -p vibex-workflow-mcp --bin vibex-server --bin vibex-mcp --bin vibex-workflow-mcp

      - name: Package Server
        shell: bash
        run: |
          ext=""
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            ext=".exe"
          fi
          VERSION="$(node -p "require('./package.json').version")"
          ARCHIVE="VibeX-${VERSION}-${{ matrix.release_name }}-server.tar.gz"
          echo "SERVER_ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"
          node scripts/package-host-family.js \
            --server "target/${{ matrix.target }}/release/vibex-server${ext}" \
            --mcp "target/${{ matrix.target }}/release/vibex-mcp${ext}" \
            --workflow-mcp "target/${{ matrix.target }}/release/vibex-workflow-mcp${ext}" \
            --web frontend/dist \
            --plugins assets/plugins \
            --output "dist/server/${{ matrix.release_name }}"
          tar -C dist/server -czf "dist/${ARCHIVE}" "${{ matrix.release_name }}"
          (
            cd dist
            shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"
          )

      - name: Upload Server archive
        uses: actions/upload-artifact@v4
        with:
          name: VibeX-server-${{ matrix.release_name }}
          path: |
            dist/${{ env.SERVER_ARCHIVE }}
            dist/${{ env.SERVER_ARCHIVE }}.sha256

      - name: Attach Server archive to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/${{ env.SERVER_ARCHIVE }}
            dist/${{ env.SERVER_ARCHIVE }}.sha256
          fail_on_unmatched_files: true

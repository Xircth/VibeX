name: Test

on:
  pull_request:
    branches:
      - master
    paths-ignore:
      - .github/workflows/**
      - "!.github/workflows/test.yml"
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: 22
  PNPM_VERSION: 10.13.1
  RUST_TOOLCHAIN: nightly-2025-12-04
  RUNNER_LABEL: &runner_label ubuntu-24.04

permissions:
  contents: read
  checks: write

jobs:
  dependency-audit:
    runs-on: *runner_label
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Setup Rust
        uses: ./.github/actions/cargo-checks-common-setup
        with:
          toolchain: stable
          cache-key: dependency-audit-${{ runner.os }}-${{ runner.arch }}-${{ env.RUNNER_LABEL }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check dependency licenses
        run: pnpm run dependency:licenses

      - name: Check Rust advisories
        uses: rustsec/audit-check@v2
        env:
          RUSTUP_TOOLCHAIN: stable
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # SQLx records its inactive PostgreSQL backend in Cargo.lock. The
          # vulnerable rsa crate has no patched release and is absent from the
          # resolved dependency graph for every target (`cargo tree --target all`).
          ignore: RUSTSEC-2023-0071

      - name: Check JavaScript advisories
        run: pnpm audit --prod --audit-level high

  frontend-build:
    runs-on: *runner_label
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: pnpm install

      - name: Build frontend
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: cd frontend && npm run build

  frontend-checks:
    runs-on: *runner_label
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: pnpm install

      - name: Run frontend checks
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          npx concurrently \
            --kill-others-on-fail \
            --names "lint,i18n,fmt,test" \
            --timings \
            "cd frontend && npm run lint" \
            "GITHUB_BASE_REF=${{ github.base_ref || 'master' }} ./scripts/check-i18n.sh" \
            "cd frontend && npm run format:check" \
            "cd frontend && npm run test"

  backend-schema-checks:
    runs-on: *runner_label
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup Rust
        uses: ./.github/actions/cargo-checks-common-setup
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          cache-key: backend-schema-checks-${{ runner.os }}-${{ runner.arch }}-${{ env.RUNNER_LABEL }}
          setup-node: "true"
          setup-sqlx-cli: "true"

      - name: Check generated types
        run: npm run generate-types:check

      - name: Sqlx checks
        run: npm run prepare-db:check

  remote-protocol-schema-smoke:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Setup Rust
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"

      - name: Install dependencies
        run: pnpm install

      - name: Compile generated TypeScript, Swift, and Kotlin protocol models
        run: pnpm run remote-protocol-schema:check

  backend-clippy:
    runs-on: *runner_label
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup Rust
        uses: ./.github/actions/cargo-checks-common-setup
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
          cache-key: backend-clippy-${{ runner.os }}-${{ runner.arch }}-${{ env.RUNNER_LABEL }}

      - name: Run Clippy and fmt checks
        run: |
          set -x
          cargo fmt --all -- --check & pid_fmt=$!
          cargo clippy --all --all-targets -- -D warnings
          wait $pid_fmt

  backend-test:
    runs-on: *runner_label
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup Rust
        uses: ./.github/actions/cargo-checks-common-setup
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          cache-key: backend-test-${{ runner.os }}-${{ runner.arch }}-${{ env.RUNNER_LABEL }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run Cargo tests
        run: cargo nextest run --workspace

  backend-platform-check:
    name: cargo check ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            runner: macos-15
          - name: windows
            runner: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup Rust
        uses: ./.github/actions/cargo-checks-common-setup
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          cache-key: backend-platform-check-${{ matrix.name }}-${{ runner.arch }}

      - name: Check workspace
        run: cargo check --workspace --all-targets --features qa-mode

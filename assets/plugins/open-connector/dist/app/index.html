  <style>:root{color-scheme:light dark;--oc-text: #46505b;--oc-strong: #1d2530;--oc-muted: #727b85;--oc-line: #0b16281a;--oc-card: #ffffff;--oc-fill: #0f172a0f;--oc-fill-hover: #0f172a14;--oc-ok: #86b300;--oc-warn: #f2ae49;--oc-bad: #f51818;--oc-radius: 14px}html[data-theme=dark]{--oc-text: #c5cdd6;--oc-strong: #e7ebef;--oc-muted: #8b95a1;--oc-line: #ffffff1a;--oc-card: #242936;--oc-fill: #ffffff0f;--oc-fill-hover: #ffffff14}html,body,#app{height:100%;margin:0}body{font:400 0.875rem/1.43 ui-sans-serif,system-ui,sans-serif;color:var(--oc-text);background:transparent}iframe{background:transparent}.surface{box-sizing:border-box;height:100%;padding:4px 0 16px;background:transparent}.oc-config{box-sizing:border-box;max-width:52rem;padding:4px 0 8px}.oc-config h2{margin:0 0 12px;color:var(--oc-strong);font-size:0.875rem;font-weight:600;letter-spacing:-0.01em}.oc-card{overflow:hidden;border:1px solid var(--oc-line);border-radius:var(--oc-radius);background:var(--oc-card)}.oc-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:16px 24px;min-height:44px;padding:12px 16px}.oc-row--stack{grid-template-columns:minmax(0,1fr);align-items:start;gap:6px}.oc-copy{display:grid;gap:4px;min-width:0}.oc-copy strong{color:var(--oc-strong);font-size:0.875rem;font-weight:600}.oc-path{color:var(--oc-muted);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:0.75rem;font-weight:400;line-height:1.4;word-break:break-all}.oc-quiet{color:var(--oc-muted);font-size:0.875rem}.oc-error{color:var(--oc-bad);font-size:0.875rem;text-align:right}.oc-status{display:inline-flex;align-items:center;gap:8px;color:var(--oc-strong);font-size:0.875rem;font-weight:500;white-space:nowrap}.oc-lamp{width:8px;height:8px;border-radius:999px;background:var(--oc-muted)}.oc-status[data-tone=ok] .oc-lamp{background:var(--oc-ok)}.oc-status[data-tone=busy] .oc-lamp{background:var(--oc-warn)}.oc-status[data-tone=bad] .oc-lamp{background:var(--oc-bad)}.oc-control{display:flex;min-width:0;max-width:28rem;align-items:center;gap:8px;justify-self:end}.oc-field{display:block;min-width:0;max-width:22rem;overflow:hidden;padding:0;border:0;background:transparent;color:var(--oc-strong);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:0.75rem;line-height:1.4;text-overflow:ellipsis;white-space:nowrap}.oc-bar{display:flex;gap:8px;margin-top:16px}.oc-btn,.oc-ghost{appearance:none;font:500 0.75rem/1 ui-sans-serif,system-ui,sans-serif;cursor:pointer}.oc-btn{height:32px;padding:0 12px;border:1px solid var(--oc-line);border-radius:var(--oc-radius);background:var(--oc-fill);color:var(--oc-strong)}.oc-btn:hover{background:var(--oc-fill-hover)}.oc-btn--danger{color:var(--oc-bad)}.oc-ghost{height:32px;padding:0 4px;border:0;background:transparent;color:var(--oc-muted);white-space:nowrap}.oc-ghost:hover{color:var(--oc-strong)}.oc-btn:focus-visible,.oc-ghost:focus-visible{outline:2px solid var(--oc-strong);outline-offset:2px}.oc-hint{max-width:65ch;margin:10px 0 0;color:var(--oc-muted);font-size:0.75rem;line-height:1.4}::selection{background:color-mix(in srgb,var(--oc-strong) 18%,transparent)}
</style><script type="module">function definePluginApp(mount){return{apiVersion:"1.0",mount}}function escapeText(value){return String(value??"").replace(/[&<>"']/g,character=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[character])}function stateLabel(state){if(state==="running")return"\u8FD0\u884C\u4E2D";if(state==="starting")return"\u542F\u52A8\u4E2D";if(state==="unhealthy")return"\u4E0D\u5065\u5EB7";return"\u5DF2\u505C\u6B62"}function stateTone(state){if(state==="running")return"ok";if(state==="unhealthy")return"bad";if(state==="starting")return"busy";return"idle"}async function mountConfigPanel(root2,invoke){const render=status=>{const origin=String(status?.origin||"").trim();const dataDir=String(status?.dataDir||"").trim();const error=String(status?.lastError||"").trim();root2.innerHTML=`
      <section class="oc-config">
        <h2>\u672C\u673A\u8FDE\u63A5\u5668</h2>
        <div class="oc-card">
          <div class="oc-row">
            <div class="oc-copy">
              <strong>\u72B6\u6001</strong>
            </div>
            <span class="oc-status" data-tone="${stateTone(status?.state)}">
              <span class="oc-lamp" aria-hidden="true"></span>
              ${escapeText(stateLabel(status?.state))}
            </span>
          </div>
          <div class="oc-row">
            <div class="oc-copy">
              <strong>\u672C\u673A\u5730\u5740</strong>
            </div>
            <div class="oc-control">
              <code class="oc-field" data-origin>${escapeText(origin||"\u2014")}</code>
              ${origin?`<button type="button" class="oc-ghost" data-action="copy">\u590D\u5236</button>`:""}
            </div>
          </div>
          <div class="oc-row oc-row--stack">
            <div class="oc-copy">
              <strong>\u6570\u636E\u76EE\u5F55</strong>
              <small class="oc-path">${escapeText(dataDir||"\u2014")}</small>
            </div>
          </div>
          <div class="oc-row">
            <div class="oc-copy">
              <strong>\u6700\u8FD1\u9519\u8BEF</strong>
            </div>
            <span class="${error?"oc-error":"oc-quiet"}">${escapeText(error||"\u65E0")}</span>
          </div>
        </div>
        <div class="oc-bar">
          <button type="button" class="oc-btn" data-action="restart">\u91CD\u542F</button>
          <button type="button" class="oc-btn oc-btn--danger" data-action="wipe">\u6E05\u9664\u6570\u636E</button>
        </div>
        <p class="oc-hint">\u6E05\u9664\u6570\u636E\u4F1A\u5220\u9664\u672C\u673A\u8FDE\u63A5\u548C\u5BC6\u94A5\uFF0C\u4E14\u4E0D\u53EF\u6062\u590D\u3002</p>
      </section>
    `};const refresh=async()=>{try{render(await invoke("runtime.status"))}catch(error){render({state:"unhealthy",lastError:error instanceof Error?error.message:String(error)})}};root2.addEventListener("click",event=>{const action=event.target?.closest?.("[data-action]")?.dataset?.action;if(action==="restart"){void invoke("runtime.restart").then(refresh,refresh)}if(action==="wipe"){if(!window.confirm("\u6E05\u9664\u672C\u673A\u8FDE\u63A5\u548C\u5BC6\u94A5\uFF1F\u6B64\u64CD\u4F5C\u4E0D\u80FD\u64A4\u9500\u3002"))return;void invoke("runtime.wipeData").then(refresh,refresh)}if(action==="copy"){const origin=root2.querySelector("[data-origin]")?.textContent?.trim();const button=event.target?.closest?.('[data-action="copy"]');if(!origin||origin==="\u2014"||!button)return;void navigator.clipboard.writeText(origin).then(()=>{button.textContent="\u5DF2\u590D\u5236";window.setTimeout(()=>{if(button.isConnected)button.textContent="\u590D\u5236"},1200)})}});await refresh();return()=>{root2.innerHTML=""}}function escapeText2(value){return String(value??"").replace(/[&<>"']/g,character=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[character])}function placeholder(title,detail){return`<section class="surface"><h1>${escapeText2(title)}</h1><p>${escapeText2(detail)}</p></section>`}async function mountConsoleEmbed(root2,invoke){const render=html=>{root2.innerHTML=html};render(placeholder("Open Connector","\u6B63\u5728\u542F\u52A8\u672C\u673A\u8FDE\u63A5\u5668\u2026"));const paint=async()=>{try{const status=await invoke("runtime.status");if(status?.state==="running"&&status.origin){root2.innerHTML="";const frame=document.createElement("iframe");frame.setAttribute("aria-label","Open Connector");frame.src=`${String(status.origin).replace(/\/$/,"")}/`;frame.setAttribute("style","border:0;width:100%;height:100%;background:transparent;display:block;");frame.addEventListener("error",()=>{render(placeholder("\u65E0\u6CD5\u6253\u5F00\u63A7\u5236\u53F0","\u672C\u673A\u9875\u9762\u6CA1\u6709\u52A0\u8F7D\u3002\u5230\u63D2\u4EF6\u914D\u7F6E\u67E5\u770B\u5730\u5740\uFF0C\u6216\u5173\u6389\u518D\u6253\u5F00\u63D2\u4EF6\u3002"))});root2.append(frame);return}if(status?.state==="starting"){render(placeholder("Open Connector","\u6B63\u5728\u542F\u52A8\u672C\u673A\u8FDE\u63A5\u5668\u2026"));return}render(placeholder("Open Connector \u672A\u5C31\u7EEA",status?.lastError||"\u5230\u63D2\u4EF6\u914D\u7F6E\u67E5\u770B\u539F\u56E0\u3002\u9996\u6B21\u542F\u7528\u9700\u8981\u4E0B\u8F7D\u8FD0\u884C\u65F6\u3002"))}catch(error){render(placeholder("Open Connector \u672A\u5C31\u7EEA",error instanceof Error?error.message:String(error)))}};await paint();const timer=setInterval(()=>{if(!root2.isConnected){clearInterval(timer);return}if(root2.querySelector("iframe"))return;void paint()},1500);return()=>{clearInterval(timer);root2.innerHTML=""}}var app_default=definePluginApp(async({root:root2,bridge:bridge2,slot})=>{const invoke=(handler,input)=>bridge2.invoke(handler,input??null);const dispose2=slot==="plugin.detail.panel"?await mountConfigPanel(root2,invoke):await mountConsoleEmbed(root2,invoke);bridge2.ready();return()=>{if(typeof dispose2==="function")void dispose2()}});var root=document.querySelector("#app")??document.body;var controller=new AbortController;var surface=globalThis.vibexSurface;if(!surface)throw new Error("vibex_app_surface_unavailable");var bootstrap=await surface.ready;var artifact=bootstrap.artifact?Object.freeze({name:bootstrap.artifact.name,readText:()=>surface.request("artifact.readText",null),writeText:(content,expectedRevision)=>surface.request("artifact.writeText",{content,expectedRevision})}):void 0;var bridge=Object.freeze({pluginId:bootstrap.pluginId,generation:bootstrap.generation,artifact,invoke:(handler,input=null)=>surface.request(handler,input),subscribe:(channel,listener)=>{if(channel!=="context")throw new Error("app_subscription_unsupported");const receive=event=>listener(event.detail);addEventListener("vibexsurfacecontext",receive);return()=>removeEventListener("vibexsurfacecontext",receive)},ready:()=>{void surface.request("surface.ready")}});var dispose=await app_default.mount({root,bridge,signal:controller.signal,slot:typeof bootstrap.slot==="string"?bootstrap.slot:void 0});addEventListener("pagehide",()=>{controller.abort();if(typeof dispose==="function")void dispose()},{once:true});
</script></body>

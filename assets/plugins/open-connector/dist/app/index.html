</style><script type="module">function definePluginApp(mount){return{apiVersion:"1.0",mount}}function escapeText(value){return String(value??"").replace(/[&<>"']/g,character=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[character])}function stateLabel(state){if(state==="running")return"\u8FD0\u884C\u4E2D";if(state==="starting")return"\u542F\u52A8\u4E2D";if(state==="unhealthy")return"\u4E0D\u5065\u5EB7";return"\u5DF2\u505C\u6B62"}function stateTone(state){if(state==="running")return"ok";if(state==="unhealthy")return"bad";if(state==="starting")return"busy";return"idle"}function copyIcon(){return`<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="5.5" y="1.75" width="7.5" height="9.5" rx="1.25" fill="none" stroke="currentColor" stroke-width="1.25"/><path d="M3 4.75h6.5v9.5H3a1.25 1.25 0 0 1-1.25-1.25V6A1.25 1.25 0 0 1 3 4.75z" fill="none" stroke="currentColor" stroke-width="1.25"/></svg>`}function checkIcon(){return`<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3.5 8.5 6.5 11.5 12.5 4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`}function label(text){return`<span class="oc-copy"><strong>${escapeText(text)}</strong></span>`}function statusChip(state){return`<span class="oc-chip oc-chip--${stateTone(state)}">

  </div>`}function row(title,control){return`<div class="oc-row">${label(title)}${control}</div>`}async function mountConfigPanel(root2,invoke){const render=status=>{const origin=String(status?.origin||"").trim();const dataDir=String(status?.dataDir||"").trim();root2.innerHTML=`

    `};const refresh=async()=>{try{render(await invoke("runtime.status"))}catch(error){render({state:"unhealthy",lastError:error instanceof Error?error.message:String(error)})}};root2.addEventListener("click",event=>{const action=event.target?.closest?.("[data-action]")?.dataset?.action;if(action==="restart"){void invoke("runtime.restart").then(refresh,refresh)}if(action==="wipe"){if(!window.confirm("\u6E05\u9664\u672C\u673A\u8FDE\u63A5\u548C\u5BC6\u94A5\uFF1F\u6B64\u64CD\u4F5C\u4E0D\u80FD\u64A4\u9500\u3002"))return;void invoke("runtime.wipeData").then(refresh,refresh)}if(action==="copy-origin"||action==="copy-path"){const button=event.target?.closest?.("[data-action]");const value=root2.querySelector(`[data-copy="${action}"]`)?.textContent?.trim();if(!value||value==="\u2014"||!button)return;void navigator.clipboard.writeText(value).then(()=>{button.innerHTML=checkIcon();window.setTimeout(()=>{if(button.isConnected)button.innerHTML=copyIcon()},1200)})}});await refresh();return()=>{root2.innerHTML=""}}function escapeText2(value){return String(value??"").replace(/[&<>"']/g,character=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[character])}function placeholder(title,detail){return`<section class="surface"><h1>${escapeText2(title)}</h1><p>${escapeText2(detail)}</p></section>`}async function mountConsoleEmbed(root2,invoke){const render=html=>{root2.innerHTML=html};render(placeholder("Open Connector","\u6B63\u5728\u542F\u52A8\u672C\u673A\u8FDE\u63A5\u5668\u2026"));const paint=async()=>{try{const status=await invoke("runtime.status");if(status?.state==="running"&&status.origin){root2.innerHTML="";const frame=document.createElement("iframe");frame.setAttribute("aria-label","Open Connector");frame.src=`${String(status.origin).replace(/\/$/,"")}/`;frame.setAttribute("style","border:0;width:100%;height:100%;background:transparent;display:block;");frame.addEventListener("error",()=>{render(placeholder("\u65E0\u6CD5\u6253\u5F00\u63A7\u5236\u53F0","\u672C\u673A

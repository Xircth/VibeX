[package]
name = "application"
version = "0.3.0"
edition = "2024"

[dependencies]
async-trait = { workspace = true }
agents = { path = "../agents" }
artifacts = { path = "../artifacts" }
chrono = { workspace = true }
conversations = { path = "../conversations" }
workflows = { path = "../workflows" }
db = { path = "../db" }
executors = { path = "../executors" }
remote-protocol = { path = "../remote-protocol" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
ts-rs = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# Integration tests build in-memory SQLite fixtures; the library itself no
# longer links SQLite (Application Core depends on ports only).
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }

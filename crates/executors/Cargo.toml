[package]
name = "executors"
version = "0.1.8"
edition = "2024"

[dependencies]
workspace_utils = { path = "../utils", package = "utils" }
git = { path = "../git" }
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["io", "compat", "rt"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
toml = "0.8"
chrono = { workspace = true }
uuid = { workspace = true }
ts-rs = { workspace = true }
schemars = { workspace = true }
dirs = { workspace = true }
xdg = "3.0"
async-trait = { workspace = true } 
command-group = { workspace = true }
regex = { workspace = true }
json-patch = { workspace = true }
thiserror = { workspace = true }
enum_dispatch = "0.3.13"
futures-io = "0.3.31"
tokio-stream = { version = "0.1.17", features = ["io-util"] }
futures = { workspace = true }
os_pipe = "1.2"
strum = { workspace = true }
strum_macros = { workspace = true }
convert_case = "0.6"
sqlx = { version = "0.8.6", default-features = false, features = ["derive"] }
shlex = "1.3.0"
agent-client-protocol = { version = "0.11.1", features = ["unstable"] }
derivative = "2.2.0"
walkdir = "2"
rand = "0.8"
jsonc-parser = { version = "0.29", features = ["cst", "serde"] }
lru = "0.12"

[target.'cfg(windows)'.dependencies]
winsplit = "0.1.0"

[features]
default = []
qa-mode = []

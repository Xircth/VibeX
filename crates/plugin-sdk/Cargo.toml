[package]
name = "vibex-plugin-sdk"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "VibeX plugin worker SDK for protocol 1.1"
license = "MIT"
publish = false

[features]
default = ["std"]
std = []
isolated = []

[dependencies]
async-trait = { workspace = true }
futures = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "io-util", "sync", "time"] }

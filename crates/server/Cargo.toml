chrono = { workspace = true }
conversations = { path = "../conversations" }
db = { path = "../db" }
dirs = { workspace = true }
delegation = { path = "../delegation" }
delegation-proto = { path = "../delegation-proto" }
deployment = { path = "../deployment" }

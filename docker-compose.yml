services:
  dimo:
    build:
      context: .
      args:
        HOST_FAMILY: dist/host-family
    # image: ghcr.io/dimo/dimo-server:latest
    ports:
      - "127.0.0.1:17891:17891"
    volumes:
      - dimo-data:/data
    environment:
      # Bind all container interfaces so Docker port publishing can reach the
      # process. Host publish stays loopback; set DIMO_SERVER_ALLOW_LAN=1 on a
      # real host NIC only behind TLS.
      DIMO_SERVER_LISTEN: 0.0.0.0:17891
      DIMO_SERVER_ALLOW_LAN: "1"
      DIMO_STATIC_ROOT: /app/web
      DIMO_DATA_DIR: /data
    restart: unless-stopped

volumes:
  dimo-data:

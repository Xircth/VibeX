<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">VibeX Agent fabric</title>
  <desc id="desc">Built-in profiles and ACP Registry agents pass through runtime validation and one unified lifecycle into sessions, worktrees and developer tools.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8fbff" />
      <stop offset="1" stop-color="#edf5ff" />
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2563eb" />
      <stop offset="1" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1e3a8a" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="1200" height="420" rx="26" fill="url(#panel)" />
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="52" y="54" fill="#1e3a8a" font-size="12" font-weight="750" letter-spacing="2.5">AGENT FABRIC</text>
    <text x="52" y="87" fill="#0f172a" font-size="25" font-weight="750">一条统一管线，连接每一种 Agent</text>

    <g fill="none" stroke="#93c5fd" stroke-width="2">
      <path d="M250 160H356" />
      <path d="M250 223H356" />
      <path d="M250 286H356" />
      <path d="M568 223H664" />
      <path d="M866 160H964" />
      <path d="M866 223H964" />
      <path d="M866 286H964" />
    </g>

    <g filter="url(#shadow)">
      <rect x="52" y="132" width="198" height="56" rx="14" fill="#fff" stroke="#bfdbfe" />
      <circle cx="78" cy="160" r="9" fill="#2563eb" />
      <text x="98" y="165" fill="#172554" font-size="14" font-weight="650">Claude Code · Codex</text>

      <rect x="52" y="195" width="198" height="56" rx="14" fill="#fff" stroke="#bfdbfe" />
      <circle cx="78" cy="223" r="9" fill="#4f46e5" />
      <text x="98" y="228" fill="#172554" font-size="14" font-weight="650">OpenCode · Pi</text>

      <rect x="52" y="258" width="198" height="56" rx="14" fill="#fff" stroke="#bfdbfe" />
      <circle cx="78" cy="286" r="9" fill="#7c3aed" />
      <text x="98" y="291" fill="#172554" font-size="14" font-weight="650">ACP Registry Agents</text>

      <rect x="356" y="125" width="212" height="196" rx="20" fill="#fff" stroke="#93c5fd" />
      <text x="382" y="160" fill="#1d4ed8" font-size="12" font-weight="750" letter-spacing="1">RUNTIME LAYER</text>
      <g fill="#334155" font-size="13">
        <text x="382" y="194">01 · 本地 Runtime 检测</text>
        <text x="382" y="227">02 · ACP 组件验证</text>
        <text x="382" y="260">03 · 版本与路径证据</text>
        <text x="382" y="293">04 · 托管安装 / 外部复用</text>
      </g>

      <rect x="664" y="125" width="202" height="196" rx="20" fill="url(#core)" />
      <text x="690" y="160" fill="#bfdbfe" font-size="12" font-weight="750" letter-spacing="1">UNIFIED LIFECYCLE</text>
      <g fill="#fff" font-size="13" font-weight="620">
        <text x="690" y="194">添加与启用</text>
        <text x="690" y="227">安装与修复</text>
        <text x="690" y="260">认证与配置</text>
        <text x="690" y="293">会话与诊断</text>
      </g>

      <rect x="964" y="132" width="184" height="56" rx="14" fill="#fff" stroke="#bfdbfe" />
      <text x="990" y="165" fill="#172554" font-size="14" font-weight="650">Conversation</text>

      <rect x="964" y="195" width="184" height="56" rx="14" fill="#fff" stroke="#bfdbfe" />
      <text x="990" y="228" fill="#172554" font-size="14" font-weight="650">Git Worktree</text>

      <rect x="964" y="258" width="184" height="56" rx="14" fill="#fff" stroke="#bfdbfe" />
      <text x="990" y="291" fill="#172554" font-size="14" font-weight="650">Tools &amp; Artifacts</text>
    </g>

    <g fill="#64748b" font-size="11" text-anchor="middle">
      <text x="151" y="351">AGENT SOURCES</text>
      <text x="462" y="351">VERIFIABLE EXECUTION</text>
      <text x="765" y="351">ONE CONTROL MODEL</text>
      <text x="1056" y="351">DELIVERY SURFACES</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">VibeX multi-agent collaboration flow</title>
  <desc id="desc">A task moves from a session through an isolated worktree and multi-agent orchestration into review and delivery.</desc>
  <rect width="1200" height="320" fill="#ffffff"/>
  <g fill="none" stroke="#000000" stroke-width="1.5">
    <rect x="24" y="24" width="1152" height="272" rx="8"/>
    <path d="M150 156 H1050"/>
    <circle cx="150" cy="156" r="36"/>
    <circle cx="375" cy="156" r="36"/>
    <circle cx="600" cy="156" r="42"/>
    <circle cx="825" cy="156" r="36"/>
    <circle cx="1050" cy="156" r="36"/>
    <circle cx="262" cy="156" r="5"/>
    <circle cx="487" cy="156" r="5"/>
    <circle cx="712" cy="156" r="5"/>
    <circle cx="937" cy="156" r="5"/>
  </g>
  <g fill="#000000" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">
    <text x="600" y="64" font-size="16" font-weight="700">Multi-Agent Collaboration</text>
    <text x="600" y="88" font-size="12">session · worktree · delegation · graph workflow · review</text>
    <text x="150" y="230" font-size="14" font-weight="700">创建会话</text>
    <text x="150" y="250" font-size="11">Goal and Agent</text>
    <text x="375" y="230" font-size="14" font-weight="700">隔离 Worktree</text>
    <text x="375" y="250" font-size="11">Branch isolation</text>
    <text x="600" y="234" font-size="14" font-weight="700">Multi-Agent</text>
    <text x="600" y="254" font-size="11">Delegate and Graph</text>
    <text x="825" y="230" font-size="14" font-weight="700">检查与审查</text>
    <text x="825" y="250" font-size="11">Git · Diff · Test</text>
    <text x="1050" y="230" font-size="14" font-weight="700">合并与交付</text>
    <text x="1050" y="250" font-size="11">Commit and ship</text>
  </g>
</svg>

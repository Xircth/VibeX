[package]
name = "vibe-ultra"
version = "0.1.0"
edition = "2024"

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite"] }
uuid = { workspace = true }
tracing = { workspace = true }
base64 = "0.22"
futures = { workspace = true }
trash = "5"
ignore = "0.4"
regex = { workspace = true }
os_info = "3.12.0"
which = "8.0.0"
dirs = { workspace = true }
ts-rs = { workspace = true }

# Reuse existing workspace crates
db = { path = "../crates/db" }
services = { path = "../crates/services" }
executors = { path = "../crates/executors" }
git = { path = "../crates/git" }
git2 = { workspace = true }
local-deployment = { path = "../crates/local-deployment" }
api-types = { path = "../crates/api-types" }
utils = { path = "../crates/utils" }
deployment = { path = "../crates/deployment" }
# Note: review crate is binary-only (no lib target), cannot be used as dependency

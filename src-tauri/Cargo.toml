[package]
name = "vibex"
version = "0.1.6"
edition = "2024"
default-run = "vibex"

[features]
qa-mode = ["executors/qa-mode"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri-plugin-redline = "=0.1.0"
tauri-plugin-vibex-inspector = { path = "../.vibex/tauri-plugin-vibex-inspector" }
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite"] }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
notify = "8.2.0"
rustls = { workspace = true }
base64 = "0.22"
futures = { workspace = true }
trash = "5"
ignore = "0.4"
regex = { workspace = true }
semver = "1"
os_info = "3.12.0"
which = "8.0.0"
dirs = { workspace = true }
ts-rs = { workspace = true }
chrono = { workspace = true }
serde_yaml = "0.9"
toml = "0.8"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
prost = "0.13"
sha2 = "0.10"
tempfile = { workspace = true }
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1.0"
# Optional passphrase encryption for portable backups (P3-4).
aes-gcm = { version = "0.10", features = ["stream"] }
argon2 = "0.5"
rand = "0.8"
raw-window-handle = "0.6"
# Deep links (P2-5). single-instance MUST be registered before deep-link.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
url = "2"

# Reuse existing workspace crates
browser-cef = { path = "../crates/browser-cef", features = ["cef-host"] }
browser-runtime = { path = "../crates/browser-runtime" }
artifacts = { path = "../crates/artifacts" }
automation = { path = "../crates/automation" }
workflows = { path = "../crates/workflows" }
application = { path = "../crates/application" }
remote-protocol = { path = "../crates/remote-protocol" }
plugins = { path = "../crates/plugins" }
server = { path = "../crates/server" }
tool-runtime = { path = "../crates/tool-runtime" }
db = { path = "../crates/db" }
conversations = { path = "../crates/conversations" }
services = { path = "../crates/services" }
executors = { path = "../crates/executors" }
strum = { workspace = true }
git = { path = "../crates/git" }
git2 = { workspace = true }
local-deployment = { path = "../crates/local-deployment" }
api-types = { path = "../crates/api-types" }
agents = { path = "../crates/agents" }
iana-time-zone = "0.1"
delegation = { path = "../crates/delegation" }
utils = { path = "../crates/utils" }
deployment = { path = "../crates/deployment" }
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"

[target.'cfg(target_os = "macos")'.dependencies]
xattr = "1.6.1"

[dev-dependencies]
tempfile = { workspace = true }
